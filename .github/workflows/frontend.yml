name: Frontend

on:
  pull_request:
    paths: ["web/**", "api/**", ".github/workflows/frontend.yml"]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '24'
      - name: Shared API type dependencies
        run: npm ci --prefix api --ignore-scripts --no-audit --no-fund
      - name: Frontend dependencies
        run: npm ci --prefix web --no-audit --no-fund
      - name: Tests
        working-directory: web
        run: npm test
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Build
        working-directory: web
        run: npm run build
