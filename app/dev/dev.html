<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRAFT development</title>
<style>
body{font:17px system-ui;max-width:850px;margin:3rem auto;padding:0 1rem;color:#202b37}
label{display:block;margin:1rem 0}input,button{font:inherit;padding:.5rem}button{cursor:pointer}
article{border-top:1px solid #ddd;padding:1rem 0}p{white-space:pre-wrap}#status{min-height:1.5em}
</style>
<h1>CRAFT development</h1>
<p>Local demonstration with synthetic documents.</p>
<form id="signin">
<label>Username <input id="username" name="username" autocomplete="username" required></label>
<label>Password <input id="password" name="password" type="password" autocomplete="current-password" required></label>
<button>Sign in</button>
</form>
<section id="account" hidden>
<p id="identity"></p><button id="signout" type="button">Sign out</button>
<form id="search">
<label>Search <input id="query" maxlength="500" required></label><button>Search documents</button>
</form>
</section>
<p id="status" role="status" aria-live="polite"></p>
<section id="results" aria-label="Search results"></section>
<script>
const byId = id => document.getElementById(id);
async function request(path, options = {}) {
  const response = await fetch(path, { ...options, credentials: "include" });
  if (!response.ok) {
    const error = await response.json();
    throw new Error(error.message || "Request failed.");
  }
  return response.status === 204 ? null : response.json();
}
function setAccount(me) {
  byId("signin").hidden = Boolean(me);
  byId("account").hidden = !me;
  byId("identity").textContent = me ? `${me.displayName} (${me.username})` : "";
  byId("results").replaceChildren();
}
function renderHit(hit) {
  const article = document.createElement("article");
  for (const [tag, text] of [["h2", hit.title], ["small", hit.headingPath], ["p", hit.text]]) {
    const node = document.createElement(tag);
    node.textContent = text;
    article.append(node);
  }
  byId("results").append(article);
}
byId("signin").addEventListener("submit", async event => {
  event.preventDefault();
  const password = byId("password").value;
  byId("password").value = "";
  try {
    await request("/api/session", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: byId("username").value, password }) });
    setAccount(await request("/api/me"));
    byId("status").textContent = "Signed in.";
  } catch (error) { byId("status").textContent = error.message; }
});
byId("search").addEventListener("submit", async event => {
  event.preventDefault();
  byId("results").replaceChildren();
  try {
    const result = await request("/api/library/search", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ query: byId("query").value }) });
    result.hits.forEach(renderHit);
    byId("status").textContent = `${result.hits.length} results${result.truncated ? " (limited)" : ""}.`;
  } catch (error) { byId("status").textContent = error.message; }
});
byId("signout").addEventListener("click", async () => {
  try {
    await request("/api/session", { method: "DELETE" });
    setAccount(null);
    byId("status").textContent = "Signed out.";
  } catch (error) { byId("status").textContent = error.message; }
});
request("/api/me").then(setAccount).catch(() => setAccount(null));
</script>
</html>
