<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRAFT development</title>
<style>
body{font:17px system-ui;max-width:850px;margin:3rem auto;padding:0 1rem;color:#202b37}
label{display:block;margin:1rem 0}input,button{font:inherit;padding:.5rem}button{cursor:pointer}
article{border-top:1px solid #ddd;padding:1rem 0}p{white-space:pre-wrap}#status{min-height:1.5em}
</style>
<h1>CRAFT development</h1>
<p>Local demonstration with synthetic documents.</p>
<form id="signin">
<label>Username <input id="username" name="username" autocomplete="username" required></label>
<label>Password <input id="password" name="password" type="password" autocomplete="current-password" required></label>
<button>Sign in</button>
</form>
<section id="account" hidden>
<p id="identity"></p><button id="signout" type="button">Sign out</button>
<form id="search">
<label>Search <input id="query" maxlength="500" required></label><button>Search documents</button>
</form>
<section id="chatpanel">
<h2>Conversations</h2>
<label>Saved conversation <select id="conversations"><option value="">New conversation</option></select></label>
<label>Title <input id="conversationtitle" maxlength="200" value="New conversation"></label>
<button id="archive" type="button">Archive conversation</button>
<form id="chat"><label>Question <textarea id="question" required></textarea></label><button id="send">Ask</button></form>
<section id="messages" aria-live="polite"></section>
<section id="workspace"><h3>Conversation files</h3><label>Upload a synthetic file <input id="file" type="file"></label><button id="upload" type="button">Upload</button><ul id="files"></ul></section>
</section>
</section>
<p id="status" role="status" aria-live="polite"></p>
<section id="results" aria-label="Search results"></section>
<script>
const byId = id => document.getElementById(id);
async function request(path, options = {}) {
  const response = await fetch(path, { ...options, credentials: "include" });
  if (!response.ok) {
    const error = await response.json();
    throw new Error(error.message || "Request failed.");
  }
  return response.status === 204 ? null : response.json();
}
function setAccount(me) {
  byId("signin").hidden = Boolean(me);
  byId("account").hidden = !me;
  byId("identity").textContent = me ? `${me.displayName} (${me.username})` : "";
  byId("results").replaceChildren();
  if (!me) { currentConversation = ""; byId("messages").replaceChildren(); byId("files").replaceChildren(); }
  if (me) refreshConversations().catch(error => { byId("status").textContent = error.message; });
}
function renderHit(hit) {
  const article = document.createElement("article");
  for (const [tag, text] of [["h2", hit.title], ["small", hit.headingPath], ["p", hit.text]]) {
    const node = document.createElement(tag);
    node.textContent = text;
    article.append(node);
  }
  byId("results").append(article);
}
byId("signin").addEventListener("submit", async event => {
  event.preventDefault();
  const password = byId("password").value;
  byId("password").value = "";
  try {
    await request("/api/session", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: byId("username").value, password }) });
    setAccount(await request("/api/me"));
    byId("status").textContent = "Signed in.";
  } catch (error) { byId("status").textContent = error.message; }
});
byId("search").addEventListener("submit", async event => {
  event.preventDefault();
  byId("results").replaceChildren();
  try {
    const result = await request("/api/library/search", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ query: byId("query").value }) });
    result.hits.forEach(renderHit);
    byId("status").textContent = `${result.hits.length} results${result.truncated ? " (limited)" : ""}.`;
  } catch (error) { byId("status").textContent = error.message; }
});
byId("signout").addEventListener("click", async () => {
  try {
    await request("/api/session", { method: "DELETE" });
    setAccount(null);
    byId("status").textContent = "Signed out.";
  } catch (error) { byId("status").textContent = error.message; }
});
let currentConversation = "";
async function refreshConversations() {
  const selected = currentConversation;
  byId("conversations").replaceChildren(new Option("New conversation", ""));
  for (const row of await request("/api/conversations")) {
    byId("conversations").append(new Option(row.title + (row.archived ? " (archived)" : ""), row.id));
  }
  byId("conversations").value = selected;
}
function renderMessage(message) {
  const article = document.createElement("article");
  if (message.role === "user" || message.role === "assistant") {
    const paragraph = document.createElement("p");
    paragraph.textContent = message.content || "";
    article.append(paragraph);
  } else if (message.activityType === "craft.answer") {
    for (const citation of message.content.citations) {
      const paragraph = document.createElement("p");
      paragraph.textContent = citation.title + ": " + citation.quote;
      article.append(paragraph);
    }
    const confidence = document.createElement("small");
    confidence.textContent = "Confidence: " + message.content.confidence.level;
    article.append(confidence);
  }
  if (article.childNodes.length) byId("messages").append(article);
}
async function reloadConversation() {
  byId("messages").replaceChildren();
  if (!currentConversation) { byId("files").replaceChildren(); byId("workspace").hidden = false; byId("send").disabled = false; return; }
  const conversation = await request("/api/conversations/" + currentConversation);
  byId("conversationtitle").value = conversation.title;
  conversation.messages.forEach(renderMessage);
  byId("workspace").hidden = conversation.archived;
  byId("send").disabled = conversation.archived;
  if (!conversation.archived) await reloadFiles();
}
async function reloadFiles() {
  byId("files").replaceChildren();
  if (!currentConversation) return;
  for (const file of await request("/api/conversations/" + currentConversation + "/files")) {
    const row = document.createElement("li"), link = document.createElement("a"), button = document.createElement("button");
    link.textContent = file.name + " (" + file.state + ")";
    link.href = "/api/conversations/" + currentConversation + "/files/" + file.id + "/content";
    button.textContent = "Delete";
    button.addEventListener("click", async () => { try { await request("/api/conversations/" + currentConversation + "/files/" + file.id, {method: "DELETE"}); await reloadFiles(); } catch (error) { byId("status").textContent = error.message; } });
    row.append(link, button); byId("files").append(row);
  }
}
byId("conversations").addEventListener("change", async () => {
  currentConversation = byId("conversations").value;
  try { await reloadConversation(); } catch (error) { byId("status").textContent = error.message; }
});
byId("chat").addEventListener("submit", async event => {
  event.preventDefault(); byId("send").disabled = true;
  try {
    if (!currentConversation) {
      const created = await request("/api/conversations", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({title: byId("conversationtitle").value})});
      currentConversation = created.id;
    }
    const response = await fetch("/api/agent/runs", {method: "POST", credentials: "include", headers: {"Content-Type": "application/json"}, body: JSON.stringify({threadId: currentConversation, runId: crypto.randomUUID(), messages: [{id: crypto.randomUUID(), role: "user", content: byId("question").value}], tools: [], context: [], state: {}})});
    if (!response.ok) throw new Error((await response.json()).message || "Run failed.");
    const reader = response.body.getReader(), decoder = new TextDecoder(), live = document.createElement("p");
    byId("messages").append(live); let buffer = "";
    while (true) {
      const part = await reader.read(); if (part.done) break;
      buffer += decoder.decode(part.value, {stream: true});
      const records = buffer.split("\n\n"); buffer = records.pop();
      for (const record of records) for (const line of record.split("\n")) if (line.startsWith("data: ")) {
        const update = JSON.parse(line.slice(6));
        if (update.type === "TEXT_MESSAGE_CONTENT") live.textContent += update.delta;
        if (update.type === "TOOL_CALL_START") byId("status").textContent = "Finding evidence.";
        if (update.type === "RUN_ERROR") throw new Error(update.message || "Run failed.");
      }
    }
    byId("question").value = ""; await refreshConversations(); await reloadConversation();
    byId("status").textContent = "Answer saved.";
  } catch (error) { byId("status").textContent = error.message; }
  finally { byId("send").disabled = false; }
});
byId("conversationtitle").addEventListener("change", async () => {
  if (!currentConversation) return;
  try { await request("/api/conversations/" + currentConversation, {method: "PATCH", headers: {"Content-Type": "application/json"}, body: JSON.stringify({title: byId("conversationtitle").value})}); await refreshConversations(); } catch (error) { byId("status").textContent = error.message; }
});
byId("upload").addEventListener("click", async () => {
  const file = byId("file").files[0]; if (!file || !currentConversation) return;
  try { await request("/api/conversations/" + currentConversation + "/files", {method: "POST", headers: {"Content-Type": file.type || "application/octet-stream", "X-File-Name": file.name, "X-Simulated": "true"}, body: file}); byId("file").value = ""; await reloadFiles(); } catch (error) { byId("status").textContent = error.message; }
});
byId("archive").addEventListener("click", async () => {
  if (!currentConversation) return;
  try { await request("/api/conversations/" + currentConversation, {method: "PATCH", headers: {"Content-Type": "application/json"}, body: JSON.stringify({archived: true})}); currentConversation = ""; await refreshConversations(); await reloadConversation(); } catch (error) { byId("status").textContent = error.message; }
});
request("/api/me").then(setAccount).catch(() => setAccount(null));
</script>
</html>
