[project]
name = "craft-process-manager"
version = "0.1.0"
description = "Owned process and container lifecycle"
requires-python = "==3.12.*"
dependencies = ["supervisor==4.3.0", "docker==7.2.0"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "craft_processes"
module-root = "src"
