[project]
name = "craft-audio-inbox"
version = "0.1.0"
description = "Local audio inbox and reviewed transcript goals"
requires-python = "==3.12.*"
dependencies = ["httpx==0.28.1"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "audio_inbox"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
