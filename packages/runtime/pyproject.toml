[project]
name = "craft-runtime"
version = "0.1.0"
description = "Independent runtime components"
requires-python = "==3.12.*"
dependencies = [
  "agent-framework-core==1.21.0",
  "anyio==4.15.1",
  "mcp==1.30.0",
  "httpx==0.28.1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "craft_runtime"
module-root = "src"
