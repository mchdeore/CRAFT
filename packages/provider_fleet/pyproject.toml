[project]
name = "craft-provider-fleet"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = ["httpx==0.28.1"]
[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
[tool.uv.build-backend]
module-name = "craft_fleet"
module-root = "src"
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
