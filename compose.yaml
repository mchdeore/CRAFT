services:
  db:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_PASSWORD: ${CRAFT_DB_ADMIN_PASSWORD:?set it in .env}
      CRAFT_OWNER_DB_PASSWORD: ${CRAFT_OWNER_DB_PASSWORD:?set it in .env}
      CRAFT_APP_DB_PASSWORD: ${CRAFT_APP_DB_PASSWORD:?set it in .env}
    ports: ["${CRAFT_DATABASE_PORT:-5432}:5432"]
    volumes:
      - db:/var/lib/postgresql                          # the PostgreSQL 18 image's path
      - ./docker/initdb.sh:/docker-entrypoint-initdb.d/10-craft.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]  # TCP: not healthy during initdb
      interval: 2s
      retries: 30
  app:
    build: .
    restart: unless-stopped
    environment: &app_environment                       # the app's own settings only
      CRAFT_APP_DB_PASSWORD: ${CRAFT_APP_DB_PASSWORD:?set it in .env}
      CRAFT_PROVIDER_ROOT: /provider
      CRAFT_DATABASE_HOST: db
      CRAFT_DATABASE_PORT: "5432"
      CRAFT_DATABASE_NAME: ${CRAFT_DATABASE_NAME:-craft_dev}
      CRAFT_LOG_LEVEL: ${CRAFT_LOG_LEVEL:-INFO}
      CRAFT_ALLOWED_ORIGINS: ${CRAFT_ALLOWED_ORIGINS:-http://localhost:8000}
      CRAFT_CROSS_ORIGIN_BROWSER: ${CRAFT_CROSS_ORIGIN_BROWSER:-false}
      CRAFT_MODEL_MAIN: ${CRAFT_MODEL_MAIN:-gpt-5.2}
      CRAFT_MODEL_CHECK: ${CRAFT_MODEL_CHECK:-gpt-5.2}
      CRAFT_MODEL_EMBEDDING: ${CRAFT_MODEL_EMBEDDING:-text-embedding-3-large}
      CRAFT_MODEL_ENDPOINT: ${CRAFT_MODEL_ENDPOINT:-}
      CRAFT_MODEL_KEY: ${CRAFT_MODEL_KEY:-}
      CRAFT_MODEL_MAX_OUTPUT_TOKENS: ${CRAFT_MODEL_MAX_OUTPUT_TOKENS:-4000}
      CRAFT_WOLFRAM_APP_ID: ${CRAFT_WOLFRAM_APP_ID:-}
      CRAFT_MCP_URL: ${CRAFT_MCP_URL:-http://127.0.0.1:8000/mcp}
    volumes: &provider_mount
      - ${CRAFT_PROVIDER_ROOT:-./var/provider}:/provider:ro
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as r; r.urlopen('http://localhost:8000/health/live', timeout=2)"]
      interval: 2s
      retries: 30
    depends_on:
      db:
        condition: service_healthy

  mcp:
    build: .
    profiles: ["mcp"]
    stdin_open: true
    network_mode: "service:app"
    environment: *app_environment
    volumes: *provider_mount
    command: ["craft", "mcp", "--as", "${CRAFT_MCP_ACCOUNT:-demo}"]
    depends_on:
      app:
        condition: service_healthy

volumes:
  db: {}
