services:
  db:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_PASSWORD: ${CRAFT_DB_ADMIN_PASSWORD:?set it in .env}
      CRAFT_OWNER_DB_PASSWORD: ${CRAFT_OWNER_DB_PASSWORD:?set it in .env}
      CRAFT_APP_DB_PASSWORD: ${CRAFT_APP_DB_PASSWORD:?set it in .env}
      CRAFT_ID_DB_PASSWORD: ${CRAFT_ID_DB_PASSWORD:-}  # craft_id is created only when set
    ports: ["${CRAFT_DATABASE_PORT:-5432}:5432"]
    volumes:
      - db:/var/lib/postgresql                          # the PostgreSQL 18 image's path
      - ./app/infrastructure/database/initdb.sh:/docker-entrypoint-initdb.d/10-craft.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]  # TCP: not healthy during initdb
      interval: 2s
      retries: 30
  app:
    build: { context: ., dockerfile: app/Dockerfile }
    restart: unless-stopped
    environment: &app_environment                       # the app's own settings only
      CRAFT_APP_DB_PASSWORD: ${CRAFT_APP_DB_PASSWORD:?set it in .env}
      CRAFT_PROVIDER_ROOT: /provider
      CRAFT_DATABASE_HOST: db
      CRAFT_DATABASE_PORT: "5432"
      CRAFT_DATABASE_NAME: ${CRAFT_DATABASE_NAME:-craft_dev}
      CRAFT_LOG_LEVEL: ${CRAFT_LOG_LEVEL:-INFO}
      CRAFT_ALLOWED_ORIGINS: ${CRAFT_ALLOWED_ORIGINS:-http://localhost:8000}
      CRAFT_CROSS_ORIGIN_BROWSER: ${CRAFT_CROSS_ORIGIN_BROWSER:-false}
      CRAFT_MODEL_MAIN: ${CRAFT_MODEL_MAIN:-gpt-5.4}
      CRAFT_MODEL_CHECK: ${CRAFT_MODEL_CHECK:-gpt-5.4}
      CRAFT_MODEL_EMBEDDING: ${CRAFT_MODEL_EMBEDDING:-text-embedding-3-large}
      CRAFT_MODEL_ENDPOINT: ${CRAFT_MODEL_ENDPOINT:-}
      CRAFT_MODEL_KEY: ${CRAFT_MODEL_KEY:-}
      CRAFT_MODEL_MAX_OUTPUT_TOKENS: ${CRAFT_MODEL_MAX_OUTPUT_TOKENS:-4000}
      CRAFT_AGENT_RUN_SECONDS: ${CRAFT_AGENT_RUN_SECONDS:-120}
      CRAFT_WOLFRAM_APP_ID: ${CRAFT_WOLFRAM_APP_ID:-}
      CRAFT_MCP_URL: ${CRAFT_MCP_URL:-http://127.0.0.1:8000/mcp}
      CRAFT_OIDC_AUTHORITY: ${CRAFT_OIDC_AUTHORITY:-}
      CRAFT_OIDC_CLIENT_ID: ${CRAFT_OIDC_CLIENT_ID:-}
      CRAFT_OIDC_CLIENT_SECRET: ${CRAFT_OIDC_CLIENT_SECRET:-}
      CRAFT_OIDC_REDIRECT_URI: ${CRAFT_OIDC_REDIRECT_URI:-http://localhost:8000/api/auth/callback}
    volumes: &provider_mount
      - ${CRAFT_PROVIDER_ROOT:-./.local/runtime/provider}:/provider:ro
    ports: ["8000:8000", "8100:8100"]                  # 8100: craft-id, which shares this network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as r; r.urlopen('http://localhost:8000/health/live', timeout=2)"]
      interval: 2s
      retries: 30
    depends_on:
      db:
        condition: service_healthy

  # Background jobs: one worker per queue, same image and command (app/infrastructure/queue.py).
  worker-agent:
    build: { context: ., dockerfile: app/Dockerfile }
    restart: unless-stopped
    command: ["craft", "worker"]
    network_mode: "service:app"                         # chat turns call the app's MCP on 127.0.0.1
    environment:
      <<: *app_environment
      CRAFT_WORKER_QUEUES: agent
      CRAFT_WORKER_CONCURRENCY_AGENT: "20"
    volumes: *provider_mount
    stop_grace_period: 900s                             # a chat turn's ceiling
    healthcheck: &worker_health
      test: ["CMD", "python", "-I", "-S", "/app/app/infrastructure/heartbeat.py"]   # no app import
      interval: 10s
      retries: 6
      start_period: 30s
    depends_on:
      app:
        condition: service_healthy

  worker-interactive:
    build: { context: ., dockerfile: app/Dockerfile }
    restart: unless-stopped
    command: ["craft", "worker"]
    environment:
      <<: *app_environment
      CRAFT_WORKER_QUEUES: interactive
      CRAFT_WORKER_CONCURRENCY_INTERACTIVE: "10"
    volumes: *provider_mount
    stop_grace_period: 120s
    healthcheck: *worker_health
    depends_on:
      db:
        condition: service_healthy

  worker-bulk:
    build: { context: ., dockerfile: app/Dockerfile }
    restart: unless-stopped
    command: ["craft", "worker"]
    environment:
      <<: *app_environment
      CRAFT_WORKER_QUEUES: bulk
      CRAFT_WORKER_CONCURRENCY_BULK: "2"
    volumes: *provider_mount
    stop_grace_period: 120s
    healthcheck: *worker_health
    depends_on:
      db:
        condition: service_healthy

  # craft-id, the stand-in for Entra. It shares the app's network so that the same address,
  # http://localhost:8100, works from the browser and from craft-app.
  id:
    build: { context: ., dockerfile: app/Dockerfile }
    restart: unless-stopped
    command: ["craft", "id", "serve"]
    network_mode: "service:app"
    environment:
      CRAFT_DATABASE_HOST: db
      CRAFT_DATABASE_PORT: "5432"
      CRAFT_DATABASE_NAME: ${CRAFT_DATABASE_NAME:-craft_dev}
      CRAFT_ID_DB_PASSWORD: ${CRAFT_ID_DB_PASSWORD:-}
      CRAFT_ID_SIGNING_KEY: ${CRAFT_ID_SIGNING_KEY:-}
      CRAFT_ID_PUBLIC_URL: http://localhost:8100
      CRAFT_LOG_LEVEL: ${CRAFT_LOG_LEVEL:-INFO}
    depends_on:
      app:
        condition: service_started

  mcp:
    build: { context: ., dockerfile: app/Dockerfile }
    profiles: ["mcp"]
    stdin_open: true
    network_mode: "service:app"
    environment: *app_environment
    volumes: *provider_mount
    command: ["craft", "mcp", "--as", "${CRAFT_MCP_ACCOUNT:-analyst}"]
    depends_on:
      app:
        condition: service_healthy

volumes:
  db: {}
