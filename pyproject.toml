[project]
name = "craft"
version = "0.1.0"
description = "CRAFT backend"
requires-python = "==3.12.*"
dependencies = [
  "fastapi>=0.141,<0.142",
  "uvicorn[standard]==0.54.0",
  "msgspec==0.22.0",
  "sqlalchemy==2.0.54",
  "psycopg[binary]==3.3.6",
  "alembic==1.20.0",
  "pgvector==0.5.1",
  "agent-framework-core==1.21.0",
  "agent-framework-foundry==1.14.1",
  "agent-framework-ag-ui==1.5.1",
  "mcp==1.30.0",
  "jupyter-client==8.6.3",
  "argon2-cffi==25.1.0",
  "python-docx==1.2.0",
  "pypdf==6.19.0",
  "python-pptx==1.0.2",
  "openpyxl==3.1.5",
  "openai==3.29.0",
  "azure-ai-projects==2.7.0",
  "anyio==4.15.1",
  "vl-convert-python==1.9.0.post1",
  "redis==6.4.0",
  "rq==2.6.0",
  "supervisor==4.3.0",
  "docker==7.2.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
    "pyright==1.1.414",
    "fpdf2==2.8.9",
    "fakeredis==2.32.1",
    "craft-python-workspace",
]

[tool.uv.workspace]
members = ["workspace/python"]

[tool.uv.sources]
craft-python-workspace = { workspace = true }

[project.scripts]
craft = "app.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "workspace/python/src"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
pythonVersion = "3.12"
include = ["app", "workspace"]
# These tests came from the old root tests/ folder, which Pyright never checked; typing them is separate work.
exclude = [
  "**/node_modules",
  "**/__pycache__",
  "**/.*",
  "app/agent/tests/test_workspace_run_controller.py",
  "app/agent/tests/test_workspace_session.py",
  "app/infrastructure/mcp/tests/test_mcp_proxy.py",
  "app/infrastructure/mcp/tests/test_mcp_retry.py",
]
extraPaths = ["workspace/python/src", "workspace/jupyter/src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["app", "workspace"]
pythonpath = ["workspace/python/src", "workspace/jupyter/src"]
# A plain run is the quick set; scripts/check full adds the docker, live and slow tests.
addopts = "-q --import-mode=importlib -m 'not docker and not live and not slow'"
markers = [
  "live: requires configured external service credentials",
  "docker: requires the restricted Python workspace image and Docker daemon",
  "slow: takes more than about a second; runs only in scripts/check full",
]

[tool.alembic]
script_location = "%(here)s/app/infrastructure/database/migrations"
file_template = "%%(rev)s_%%(slug)s"
prepend_sys_path = ["."]
