{{- if .Values.id.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-id
  labels: { app.kubernetes.io/name: id, app.kubernetes.io/instance: {{ .Release.Name }} }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: id, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: id, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      # No service-link variables: services named craft-* would add unknown CRAFT_* settings.
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: id
          {{- include "craft.image" . | nindent 10 }}
          command: [craft, id, serve]
          env:
            {{- range list "CRAFT_DATABASE_NAME" "CRAFT_ID_DB_PASSWORD" "CRAFT_ID_SIGNING_KEY" "CRAFT_LOG_LEVEL" }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef: { name: {{ $.Values.secret }}, key: {{ . }}, optional: true }
            {{- end }}
            - { name: CRAFT_DATABASE_HOST, value: {{ .Release.Name }}-postgres }
            - { name: CRAFT_DATABASE_PORT, value: "5432" }
            - { name: CRAFT_ID_PUBLIC_URL, value: {{ .Values.id.publicUrl | quote }} }
          ports: [{ name: http, containerPort: {{ .Values.id.port }} }]
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 5
          resources:
            limits: { memory: {{ .Values.id.memory }} }
            requests: { memory: {{ .Values.memoryRequest }} }
          {{- include "craft.containerSecurity" . | nindent 10 }}
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-id
spec:
  type: {{ .Values.id.service.type }}
  selector: { app.kubernetes.io/name: id, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: http, port: {{ .Values.id.port }}, targetPort: http }]
{{- end }}
